name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Create .npmrc from template
        env:
          NPM_LAIOUTR_TOKEN: ${{ secrets.NPM_LAIOUTR_TOKEN }}
        run: sed "s|NPM_LAIOUTR_TOKEN|${NPM_LAIOUTR_TOKEN}|" .npmrc.config > .npmrc

      - name: Install dependencies
        run: pnpm install

      # The playground imports ../laioutrrc.json, a project's own config that is never committed.
      - name: Create laioutrrc.json from CI mock
        run: cp laioutrrc.ci.json laioutrrc.json

      # tsconfig.json extends ./.nuxt/tsconfig.json, which this generates; without it every import is unresolved.
      - name: Prepare
        run: pnpm run dev:prepare

      - name: Lint
        run: pnpm run lint

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Create .npmrc from template
        env:
          NPM_LAIOUTR_TOKEN: ${{ secrets.NPM_LAIOUTR_TOKEN }}
        run: sed "s|NPM_LAIOUTR_TOKEN|${NPM_LAIOUTR_TOKEN}|" .npmrc.config > .npmrc

      - name: Install dependencies
        run: pnpm install

      # The playground imports ../laioutrrc.json, a project's own config that is never committed.
      - name: Create laioutrrc.json from CI mock
        run: cp laioutrrc.ci.json laioutrrc.json

      - name: Playground prepare
        run: pnpm run dev:prepare

      - name: Test
        run: pnpm run test
